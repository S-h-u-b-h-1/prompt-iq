<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromptIQ Smart Template Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #18211d; background: #f2f5f1; font-family: Inter, system-ui, sans-serif; }
    main { width: min(100% - 32px, 760px); margin: 40px auto; }
    h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: 0; }
    p { color: #53635b; }
    label { display: block; margin: 18px 0 7px; font-size: 13px; font-weight: 750; }
    textarea, select { width: 100%; border: 1px solid #cbd5cf; border-radius: 6px; background: white; font: inherit; }
    textarea { min-height: 130px; padding: 12px; resize: vertical; }
    select { padding: 10px; }
    button { margin-top: 18px; padding: 11px 16px; border: 0; border-radius: 6px; color: white; background: #176746; font: inherit; font-weight: 800; cursor: pointer; }
    pre { min-height: 160px; margin-top: 20px; padding: 16px; overflow: auto; border: 1px solid #d8dfda; border-radius: 6px; background: white; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Smart Template test</h1>
    <p>This development page exercises the same private, local optimizer used by the Free plan.</p>
    <label for="prompt">Draft prompt</label>
    <textarea id="prompt">write a cold email for sales</textarea>
    <label for="platform">Platform</label>
    <select id="platform">
      <option value="chatgpt">ChatGPT</option>
      <option value="claude">Claude</option>
      <option value="gemini">Gemini</option>
    </select>
    <button id="optimize-btn" type="button">Run Smart Template</button>
    <pre id="output">Ready.</pre>
  </main>
  <script type="module">
    import { analyzeAndEnhancePrompt } from './src/lib/local-optimizer.js';
    import { scorePrompt } from './src/lib/scorer.js';

    document.getElementById('optimize-btn').addEventListener('click', () => {
      const originalPrompt = document.getElementById('prompt').value;
      const platform = document.getElementById('platform').value;
      const result = analyzeAndEnhancePrompt(originalPrompt, { platform });
      document.getElementById('output').textContent = JSON.stringify({
        originalScore: scorePrompt(originalPrompt),
        ...result,
        optimizedScore: scorePrompt(result.enhancedPrompt || '')
      }, null, 2);
    });
  </script>
</body>
</html>
